<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  body { background: var(--fondo); }
  .f-cab { background: #4A1527; color: #F4F6F2; padding: 1rem 16px 4.5rem; }
  .f-cab .fila1 { display: flex; justify-content: space-between; align-items: center; gap: .75rem; max-width: 760px; margin: 0 auto; }
  .f-cab .marca, .f-cab .marca span { color: #F4F6F2; } .f-cab .marca b { color: #F2C94C; }
  .f-cab .b-tema { background: transparent; border-color: rgba(255,255,255,.3); color: #F4F6F2; }
  .f-cab h1 { color: #F4F6F2; max-width: 760px; margin: 1.25rem auto .25rem; font-size: 1.6rem; }
  .f-cab p { max-width: 760px; margin: 0 auto; color: rgba(244,246,242,.75); }
  .f-main { max-width: 760px; margin: -3.5rem auto 0; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  .hijos { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; margin-bottom: 1rem; }
  .hijo { display: flex; align-items: center; gap: .6rem; padding: .5rem .9rem .5rem .5rem; border-radius: 99px; border: 1px solid var(--renglon); background: var(--papel); font: inherit; cursor: pointer; white-space: nowrap; color: var(--texto); box-shadow: var(--sombra); }
  .hijo[aria-pressed="true"] { border: 2px solid #F2C94C; }
  .hijo .av { width: 34px; height: 34px; border-radius: 50%; background: #F3E3E8; color: #6E1F3A; display: grid; place-items: center; font-weight: 800; font-family: var(--display); overflow: hidden; }
  .hijo .av img { width: 100%; height: 100%; object-fit: cover; }
  .p-barra [aria-current="page"] { color: #6E1F3A; }
  :root[data-theme="dark"] .p-barra [aria-current="page"] { color: #F2C94C; }
  .p-barra { display: grid; }
  .nota-grande { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1; }
</style>
