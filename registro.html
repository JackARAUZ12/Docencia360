<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crear cuenta · Docencia360</title>
<meta name="description" content="Crea tu cuenta de Docencia360 y pruébala gratis.">
<link rel="icon" href="assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/d360.css">
<style>
  .reg { max-width: 760px; margin: 0 auto; padding: 1.5rem 16px 4rem; }
  .reg header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; }
  .pasos { display: flex; gap: 1.25rem; margin-bottom: 1.5rem; font-size: .92rem; color: var(--texto-3); flex-wrap: wrap; }
  .pasos [aria-current="step"] { color: var(--texto); font-weight: 700; }
  .opciones { display: grid; gap: .75rem; }
  .opcion { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; text-align: left; padding: 1rem 1.1rem; border: 1px solid var(--renglon-fuerte); border-radius: var(--radio); background: var(--papel); cursor: pointer; font: inherit; color: var(--texto); width: 100%; }
  .opcion:hover:not([disabled]) { border-color: var(--acento); }
  .opcion[aria-pressed="true"] { border: 2px solid var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
  .opcion[disabled] { opacity: .6; cursor: not-allowed; }
  .opcion .ini { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--acento-suave); color: var(--acento); }
  .opcion .precio { text-align: right; font-weight: 700; white-space: nowrap; }
  .opcion .precio small { display: block; font-weight: 400; color: var(--texto-3); }
  .opcion ul { margin: .35rem 0 0; padding-left: 1.1rem; color: var(--texto-2); font-size: .92rem; }
  .navegar { display: flex; justify-content: space-between; gap: .75rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<div class="reg">
  <header><span id="marca"></span><a href="entrar.html">Ya tengo cuenta</a></header>
  <nav class="pasos" aria-label="Pasos"><span data-p="1">1. Tipo de cuenta</span><span data-p="2">2. Plan</span><span data-p="3">3. Tus datos</span></nav>
  <div id="aviso"></div>
  <main id="contenido"></main>
</div>
<script src="assets/vendor/supabase.js"></script>
<script type="module">
import { CONFIG } from "./assets/js/config.js";
import { sb, q, mensajeError } from "./assets/js/core/sb.js";
import { h, marca, dinero } from "./assets/js/core/ui.js";
import { sesionActual, misCuentas, elegirCuenta, ruta, RUTA_MODALIDAD } from "./assets/js/core/sesion.js";

document.getElementById("marca").append(marca("index.html"));
const cont = document.getElementById("contenido");
const aviso = document.getElementById("aviso");
const mostrar = (m, t = "mal") => aviso.replaceChildren(h(`div.aviso.${t}`, { role: "alert" }, m));
const limpiar = () => aviso.replaceChildren();

const MODALIDADES = [
  { id: "profesor", t: "Profesor independiente", d: "Clases particulares, tutorías y cursos propios.", ini: "P" },
  { id: "academia", t: "Academia o centro de cursos", d: "Inglés, música, informática, capacitación, reforzamiento.", ini: "A" },
  { id: "colegio",  t: "Colegio o institución", d: "Grados, secciones, docentes, boletines y familias.", ini: "C" },
];
const PEND = "d360-registro-pendiente";
const estado = { modalidad: null, plan: null, planes: [], dias: 14, tc: 36.62 };
const sesion = await sesionActual();
const soloCuenta = !!sesion;   // ya tiene usuario: solo falta crear la cuenta

// Configuración pública y planes reales desde la base
const [planes, cfg] = await Promise.all([
  q(sb.from("planes").select("*").eq("activo", true).order("orden")),
  q(sb.from("config_global").select("clave,valor").like("clave", "publico.%")),
]).catch((e) => { mostrar(mensajeError(e)); return [[], []]; });
estado.planes = planes;
for (const c of cfg) { if (c.clave === "publico.dias_prueba") estado.dias = Number(c.valor); }

// Si vuelve tras confirmar su correo, completar con lo que había elegido
let pendiente = null;
try { pendiente = JSON.parse(localStorage.getItem(PEND) || "null"); } catch (_) {}
const qp = new URLSearchParams(location.search);
if (soloCuenta && (await misCuentas()).length && !qp.get("nueva")) { location.replace(ruta("entrar.html")); }
const pre = qp.get("modalidad");
if (pre && CONFIG.modalidadesAbiertas.includes(pre)) estado.modalidad = pre;
if (qp.get("plan")) estado.plan = qp.get("plan");

function marcarPaso(n) {
  document.querySelectorAll("[data-p]").forEach((s) => Number(s.dataset.p) === n ? s.setAttribute("aria-current", "step") : s.removeAttribute("aria-current"));
}

function paso1() {
  marcarPaso(1); limpiar();
  cont.replaceChildren(
    h("h1", "¿Cómo vas a usar Docencia360?"),
    h("p.suave", `Cada tipo de cuenta tiene su propio panel. Pruébalo gratis ${estado.dias} días, sin tarjeta.`),
    h("div.opciones", MODALIDADES.map((m) => {
      const abierta = CONFIG.modalidadesAbiertas.includes(m.id);
      return h("button.opcion", { type: "button", disabled: !abierta, "aria-pressed": String(estado.modalidad === m.id),
        onclick: () => { estado.modalidad = m.id; estado.plan = null; paso2(); } },
        h("span.ini", m.ini), h("span", h("strong", m.t), h("br"), h("span.suave", m.d)),
        h("span.precio", abierta ? "Elegir" : h("span.estado.ojo", "Próximamente")));
    })),
  );
}

function paso2() {
  marcarPaso(2); limpiar();
  const lista = estado.planes.filter((p) => p.modalidad === estado.modalidad);
  if (!estado.plan) estado.plan = lista[1]?.id || lista[0]?.id;
  const lim = (v, txt) => (v == null ? `${txt} sin límite` : v === 0 ? null : `Hasta ${v} ${txt}`);
  cont.replaceChildren(
    h("h1", "Elige tu plan"),
    h("p.suave", `Empiezas con ${estado.dias} días gratis del plan que elijas. Puedes cambiarlo después.`),
    h("div.opciones", lista.map((p) => h("button.opcion", { type: "button", "aria-pressed": String(estado.plan === p.id),
      onclick: (ev) => { estado.plan = p.id; cont.querySelectorAll(".opcion").forEach((o) => o.setAttribute("aria-pressed", String(o === ev.currentTarget))); } },
      h("span.ini", p.nombre[0]),
      h("span", h("strong", p.nombre), h("br"), h("span.suave", p.resumen),
        h("ul", [lim(p.max_estudiantes, "estudiantes"), lim(p.max_grupos, "grupos"),
                 p.funciones?.reportes_pdf ? "Informes en PDF" : null,
                 p.modalidad !== "profesor" ? lim(p.max_docentes, "instructores") : null,
                 p.funciones?.finanzas ? "Matrículas, cobros y recibos" : null,
                 p.funciones?.certificados ? "Certificados con folio" : null,
                 p.funciones?.portal_familias ? "Portal de familias" : null,
                 p.funciones?.asistentes ? "1 asistente con su propio acceso" : null].filter(Boolean).map((t) => h("li", t)))),
      h("span.precio", dinero(p.precio_nio, "NIO"), h("small", `${dinero(p.precio_usd, "USD")} al mes`))))),
    h("div.navegar", h("button.btn.btn-sec", { onclick: paso1 }, "Atrás"), h("button.btn", { onclick: paso3 }, "Continuar")),
  );
}

function paso3() {
  marcarPaso(3); limpiar();
  const form = h("form", { novalidate: true },
    h("div.fila",
      h("label.campo", h("span", "Tu nombre"), h("input", { name: "tu_nombre", required: true, autocomplete: "name", value: pendiente?.tu_nombre || "" })),
      h("label.campo", h("span", estado.modalidad === "profesor" ? "Nombre de tu espacio" : "Nombre de la institución"),
        h("input", { name: "nombre", required: true, placeholder: estado.modalidad === "profesor" ? "Ej.: Clases de Matemática Prof. Ana" : "Ej.: Academia de Inglés Horizonte", value: pendiente?.nombre || "" }),
        h("small", "Aparece en recibos, informes y certificados."))),
    h("div.fila",
      h("label.campo", h("span", "Teléfono (opcional)"), h("input", { name: "telefono", type: "tel", autocomplete: "tel", value: pendiente?.telefono || "" })),
      h("label.campo", h("span", "Moneda"), h("select", { name: "moneda" }, h("option", { value: "NIO" }, "Córdobas (C$)"), h("option", { value: "USD" }, "Dólares (US$)")))),
    soloCuenta ? null : h("div.fila",
      h("label.campo", h("span", "Correo"), h("input", { name: "email", type: "email", required: true, autocomplete: "email" })),
      h("label.campo", h("span", "Contraseña"), h("input", { name: "clave", type: "password", required: true, minLength: 8, autocomplete: "new-password" }), h("small", "Mínimo 8 caracteres."))),
    h("div.navegar", h("button.btn.btn-sec", { type: "button", onclick: paso2 }, "Atrás"), h("button.btn", { type: "submit" }, "Crear mi cuenta")),
  );
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); limpiar();
    const d = Object.fromEntries(new FormData(form));
    if (!d.tu_nombre?.trim() || !d.nombre?.trim()) return mostrar("Escribe tu nombre y el nombre de tu espacio.");
    if (!soloCuenta && (!d.email || (d.clave || "").length < 8)) return mostrar("Escribe un correo válido y una contraseña de al menos 8 caracteres.");
    const b = form.querySelector("[type=submit]"); b.disabled = true; b.textContent = "Creando…";
    const datosCuenta = { modalidad: estado.modalidad, plan: estado.plan, tu_nombre: d.tu_nombre, nombre: d.nombre, telefono: d.telefono, moneda: d.moneda };
    try {
      if (!soloCuenta) {
        const { data, error } = await sb.auth.signUp({ email: d.email, password: d.clave,
          options: { emailRedirectTo: ruta("registro.html?paso=cuenta"), data: { nombre: d.tu_nombre } } });
        if (error) throw error;
        if (!data.session) {   // el proyecto pide confirmar el correo
          try { localStorage.setItem(PEND, JSON.stringify(datosCuenta)); } catch (_) {}
          cont.replaceChildren(h("h1", "Revisa tu correo"),
            h("p", `Te enviamos un enlace a ${d.email}. Ábrelo para activar tu cuenta; tu espacio se creará automáticamente.`));
          return;
        }
      }
      await crearCuenta(datosCuenta);
    } catch (err) { mostrar(mensajeError(err)); }
    finally { b.disabled = false; b.textContent = "Crear mi cuenta"; }
  });
  cont.replaceChildren(h("h1", "Tus datos"), form);
}

async function crearCuenta(d) {
  const r = await q(sb.rpc("d360_crear_cuenta", { p_modalidad: d.modalidad, p_nombre: d.nombre, p_tu_nombre: d.tu_nombre,
    p_plan: d.plan, p_telefono: d.telefono || null, p_moneda: d.moneda || "NIO" }));
  try { localStorage.removeItem(PEND); } catch (_) {}
  elegirCuenta(r.cuenta_id);
  document.querySelector(".pasos").remove();
  cont.replaceChildren(
    h("h1", h("span.resaltado", "Tu cuenta está lista")),
    h("p", "Guarda estos dos códigos. Con ellos puedes entrar desde cualquier teléfono o computadora sin escribir tu correo."),
    h("div.hoja",
      h("p.etiqueta", "Código de tu institución"), h("p", h("span.codigo-grande", r.codigo_institucion)),
      h("p.etiqueta", "Tu código personal"), h("p", h("span.codigo-grande", r.codigo_personal)),
      h("p.tenue", "Tu código personal es secreto y no se vuelve a mostrar. Si lo pierdes, genera uno nuevo desde Mi cuenta.")),
    h("div.navegar", h("span"), h("a.btn", { href: ruta(RUTA_MODALIDAD[d.modalidad]) }, "Ir a mi panel")),
  );
}

if (soloCuenta && pendiente) {
  // Volvió del enlace de confirmación: crear la cuenta con lo que ya eligió
  cont.replaceChildren(h("p.suave", "Creando tu espacio…"));
  crearCuenta(pendiente).catch((e) => { mostrar(mensajeError(e)); estado.modalidad = pendiente.modalidad; estado.plan = pendiente.plan; paso3(); });
} else if (estado.modalidad) { estado.plan ? paso3() : paso2(); }
else paso1();
</script>
</body>
</html>
