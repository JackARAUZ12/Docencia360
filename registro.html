<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("d360-tema")==="oscuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crear cuenta · Docencia360</title>
<meta name="description" content="Crea tu cuenta de Docencia360 para tu clase, academia o colegio.">
<link rel="icon" href="assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/d360.css">
<style>
  .reg { max-width: 1080px; margin: 0 auto; padding: 1.25rem 16px 4rem; }
  .reg header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; gap: 1rem; padding-right: 52px; }
  .reg-cuerpo { display: grid; gap: 2rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 900px) { .reg-cuerpo { grid-template-columns: minmax(0, 1fr) 320px; gap: 3rem; } }
  .pasos { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: 1.75rem; counter-reset: p; }
  .pasos span { counter-increment: p; font-size: .9rem; color: var(--texto-3); padding-top: .6rem; border-top: 4px solid var(--renglon); }
  .pasos span::before { content: counter(p) ". "; }
  .pasos span.hecho { color: var(--texto-2); border-top-color: var(--tinta); }
  .pasos [aria-current="step"] { color: var(--texto); font-weight: 700; border-top-color: var(--amarilla, #F2C94C); }
  .opciones { display: grid; gap: .75rem; }
  .opcion { display: grid; grid-template-columns: 26px 1fr auto; gap: 1rem; align-items: start; text-align: left; padding: 1.1rem 1.2rem; border: 1.5px solid var(--renglon-fuerte); border-radius: 14px; background: var(--papel); cursor: pointer; font: inherit; color: var(--texto); width: 100%; transition: border-color .15s, box-shadow .15s; }
  .opcion:hover:not([disabled]) { border-color: var(--tinta); }
  .opcion[aria-pressed="true"] { border: 2px solid var(--tinta); box-shadow: 0 0 0 4px var(--tinta-suave); padding: calc(1.1rem - .5px) calc(1.2rem - .5px); }
  .opcion[disabled] { opacity: .6; cursor: not-allowed; }
  .opcion .marca-sel { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--renglon-fuerte); margin-top: .15rem; display: grid; place-items: center; }
  .opcion[aria-pressed="true"] .marca-sel { border-color: var(--tinta); background: var(--tinta); }
  .opcion[aria-pressed="true"] .marca-sel::after { content: ""; width: 8px; height: 5px; border-left: 2px solid var(--papel); border-bottom: 2px solid var(--papel); transform: rotate(-45deg) translate(1px, -1px); }
  .opcion strong { font-family: var(--display); font-size: 1.15rem; }
  .opcion .precio { text-align: right; white-space: nowrap; }
  .opcion .precio b { display: block; font-family: var(--display); font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
  .opcion .precio small { display: block; color: var(--texto-3); }
  .opcion ul { margin: .5rem 0 0; padding: 0; list-style: none; color: var(--texto-2); font-size: .93rem; }
  .opcion li { padding-left: 1.3rem; position: relative; margin-top: .2rem; }
  .opcion li::before { content: ""; position: absolute; left: 2px; top: .45rem; width: 9px; height: 5px; border-left: 2px solid #1F7552; border-bottom: 2px solid #1F7552; transform: rotate(-45deg); }
  @media (max-width: 560px) { .opcion { grid-template-columns: 22px 1fr; } .opcion .precio { grid-column: 2; text-align: left; } }
  .navegar { display: flex; justify-content: space-between; gap: .75rem; margin-top: 1.75rem; }
  .navegar .btn { min-width: 140px; }
  .resumen-reg { position: sticky; top: 1.5rem; background: var(--pizarra, #1E3A32); color: #F4F6F2; border-radius: 16px; padding: 1.5rem; }
  .resumen-reg h2 { font-size: 1.15rem; color: #F4F6F2; }
  .resumen-reg dl { margin: 0; }
  .resumen-reg dt { font-size: .85rem; color: rgba(244,246,242,.65); margin-top: .9rem; }
  .resumen-reg dd { margin: .1rem 0 0; font-weight: 700; }
  .resumen-reg .total { font-family: var(--display); font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; }
  .resumen-reg ol { margin: 1.25rem 0 0; padding: 1rem 0 0 1.1rem; border-top: 1px solid rgba(255,255,255,.15); color: rgba(244,246,242,.8); font-size: .92rem; }
  .resumen-reg li { margin-bottom: .35rem; }
  @media (max-width: 899px) { .resumen-reg { position: static; order: 2; } }
</style>
</head>
<body>
<div class="reg">
  <header><span id="marca"></span><a href="entrar.html">Ya tengo cuenta</a></header>
  <nav class="pasos" aria-label="Pasos"><span data-p="1">Tipo de cuenta</span><span data-p="2">Plan</span><span data-p="3">Tus datos</span></nav>
  <div class="reg-cuerpo">
    <div><div id="aviso"></div><main id="contenido"></main></div>
    <aside class="resumen-reg" id="resumen" aria-live="polite"></aside>
  </div>
</div>
<script src="assets/vendor/supabase.js"></script>
<script type="module">
import { botonTema } from "./assets/js/core/tema.js";
{ const b = botonTema(); b.style.cssText = "position:fixed;top:12px;right:12px;z-index:50"; document.body.append(b); }
import { CONFIG } from "./assets/js/config.js";
import { sb, q, mensajeError } from "./assets/js/core/sb.js";
import { h, marca, dinero } from "./assets/js/core/ui.js";
import { sesionActual, misCuentas, elegirCuenta, ruta, RUTA_MODALIDAD } from "./assets/js/core/sesion.js";

document.getElementById("marca").append(marca("index.html"));
const cont = document.getElementById("contenido");
const aviso = document.getElementById("aviso");
const mostrar = (m, t = "mal") => aviso.replaceChildren(h(`div.aviso.${t}`, { role: "alert" }, m));
const limpiar = () => aviso.replaceChildren();

const MODALIDADES = [
  { id: "profesor", t: "Profesor independiente", d: "Clases particulares, tutorías y cursos propios.", ini: "P" },
  { id: "academia", t: "Academia o centro de cursos", d: "Inglés, música, informática, capacitación, reforzamiento.", ini: "A" },
  { id: "colegio",  t: "Colegio o institución", d: "Grados, secciones, docentes, boletines y familias.", ini: "C" },
];
const PEND = "d360-registro-pendiente";
const estado = { modalidad: null, plan: null, planes: [], dias: 0, whatsapp: "", terminos: "" };
const sesion = await sesionActual();
const soloCuenta = !!sesion;   // ya tiene usuario: solo falta crear la cuenta

// Configuración pública y planes reales desde la base
const [planes, cfg] = await Promise.all([
  q(sb.from("planes").select("*").eq("activo", true).order("orden")),
  q(sb.from("config_global").select("clave,valor").like("clave", "publico.%")),
]).catch((e) => { mostrar(mensajeError(e)); return [[], []]; });
estado.planes = planes;
for (const c of cfg) { if (c.clave === "publico.dias_prueba") estado.dias = Number(c.valor) || 0; if (c.clave === "publico.contacto_whatsapp") estado.whatsapp = String(c.valor || "").replace(/\D/g, ""); if (c.clave === "publico.terminos_version") estado.terminos = String(c.valor || ""); }

// Si vuelve tras confirmar su correo, completar con lo que había elegido
let pendiente = null;
try { pendiente = JSON.parse(localStorage.getItem(PEND) || "null"); } catch (_) {}
const qp = new URLSearchParams(location.search);
if (soloCuenta && (await misCuentas()).length && !qp.get("nueva")) { location.replace(ruta("entrar.html")); }
const pre = qp.get("modalidad");
if (pre && CONFIG.modalidadesAbiertas.includes(pre)) estado.modalidad = pre;
if (qp.get("plan")) estado.plan = qp.get("plan");

function marcarPaso(n) {
  document.querySelectorAll("[data-p]").forEach((s) => {
    const p = Number(s.dataset.p);
    p === n ? s.setAttribute("aria-current", "step") : s.removeAttribute("aria-current");
    s.classList.toggle("hecho", p < n);
  });
  pintarResumen();
}

const NOMBRE_MOD = { profesor: "Profesor independiente", academia: "Academia o centro de cursos", colegio: "Colegio" };
function pintarResumen() {
  const r = document.getElementById("resumen"); if (!r) return;
  const plan = estado.planes.find((p) => p.id === estado.plan);
  r.replaceChildren(
    h("h2", "Tu elección"),
    h("dl",
      h("dt", "Tipo de cuenta"), h("dd", estado.modalidad ? NOMBRE_MOD[estado.modalidad] : "Por elegir"),
      h("dt", "Plan"), h("dd", plan ? plan.nombre : "Por elegir"),
      plan ? [h("dt", "Pagas al mes"), h("dd.total", dinero(plan.precio_nio, "NIO").replace(/\.00$/, "")), h("dd", { style: "font-weight:400;color:rgba(244,246,242,.7)" }, `o ${dinero(plan.precio_usd, "USD")}`)] : null),
    h("ol",
      h("li", "Creas tu cuenta y recibes tus códigos de acceso."),
      h("li", estado.dias > 0 ? `Usas tu cuenta ${estado.dias} días de prueba.` : "Pagas el primer mes por transferencia o depósito."),
      h("li", estado.dias > 0 ? "Al terminar la prueba, eliges seguir y pagas." : "Activamos tu cuenta el mismo día y empiezas a trabajar.")));
}

function paso1() {
  marcarPaso(1); limpiar();
  cont.replaceChildren(
    h("h1", "¿Cómo vas a usar Docencia360?"),
    h("p.suave", "Cada tipo de cuenta tiene su propio panel. ¿Quieres verlo antes? ", h("a", { href: "index.html?demo=1" }, "Mira una demostración"), "."),
    h("div.opciones", MODALIDADES.map((m) => {
      const abierta = CONFIG.modalidadesAbiertas.includes(m.id);
      return h("button.opcion", { type: "button", disabled: !abierta, "aria-pressed": String(estado.modalidad === m.id),
        onclick: () => { estado.modalidad = m.id; estado.plan = null; paso2(); } },
        h("span.marca-sel"), h("span", h("strong", m.t), h("br"), h("span.suave", m.d)),
        h("span.precio", abierta ? "Elegir" : h("span.estado.ojo", "Próximamente")));
    })),
  );
}

function paso2() {
  marcarPaso(2); limpiar();
  const lista = estado.planes.filter((p) => p.modalidad === estado.modalidad);
  if (!estado.plan) estado.plan = lista[1]?.id || lista[0]?.id;
  pintarResumen();
  const lim = (v, txt) => (v == null ? `${txt.charAt(0).toUpperCase() + txt.slice(1)} sin límite` : v === 0 ? null : `Hasta ${v} ${txt}`);
  cont.replaceChildren(
    h("h1", "Elige tu plan"),
    h("p.suave", estado.dias > 0 ? `Empiezas con ${estado.dias} días de prueba del plan que elijas.` : "Tu cuenta se activa al confirmar el pago del primer mes. Puedes cambiar de plan después."),
    h("div.opciones", lista.map((p) => h("button.opcion", { type: "button", "aria-pressed": String(estado.plan === p.id),
      onclick: (ev) => { estado.plan = p.id; cont.querySelectorAll(".opcion").forEach((o) => o.setAttribute("aria-pressed", String(o === ev.currentTarget))); pintarResumen(); } },
      h("span.marca-sel"),
      h("span", h("strong", p.nombre), h("br"), h("span.suave", p.resumen),
        h("ul", [lim(p.max_estudiantes, "estudiantes"), lim(p.max_grupos, "grupos"),
                 p.funciones?.reportes_pdf ? "Informes en PDF" : null,
                 p.modalidad !== "profesor" ? lim(p.max_docentes, "instructores") : null,
                 p.funciones?.finanzas ? "Matrículas, cobros y recibos" : null,
                 p.funciones?.certificados ? "Certificados con folio" : null,
                 p.funciones?.portal_familias ? "Portal de familias" : null,
                 p.funciones?.asistentes ? "1 asistente con su propio acceso" : null].filter(Boolean).map((t) => h("li", t)))),
      h("span.precio", h("b", dinero(p.precio_nio, "NIO").replace(/\.00$/, "")), h("small", `al mes · ${dinero(p.precio_usd, "USD")}`))))),
    h("div.navegar", h("button.btn.btn-sec", { onclick: paso1 }, "Atrás"), h("button.btn", { onclick: paso3 }, "Continuar")),
  );
}

function paso3() {
  marcarPaso(3); limpiar();
  const form = h("form", { novalidate: true },
    h("div.fila",
      h("label.campo", h("span", "Tu nombre"), h("input", { name: "tu_nombre", required: true, autocomplete: "name", value: pendiente?.tu_nombre || "" })),
      h("label.campo", h("span", estado.modalidad === "profesor" ? "Nombre de tu espacio" : "Nombre de la institución"),
        h("input", { name: "nombre", required: true, placeholder: estado.modalidad === "profesor" ? "Ej.: Clases de Matemática Prof. Ana" : "Ej.: Academia de Inglés Horizonte", value: pendiente?.nombre || "" }),
        h("small", "Aparece en recibos, informes y certificados."))),
    h("div.fila",
      h("label.campo", h("span", "Teléfono (opcional)"), h("input", { name: "telefono", type: "tel", autocomplete: "tel", value: pendiente?.telefono || "" })),
      h("label.campo", h("span", "Moneda"), h("select", { name: "moneda" }, h("option", { value: "NIO" }, "Córdobas (C$)"), h("option", { value: "USD" }, "Dólares (US$)")))),
    soloCuenta ? null : h("div.fila",
      h("label.campo", h("span", "Correo"), h("input", { name: "email", type: "email", required: true, autocomplete: "email" })),
      h("label.campo", h("span", "Contraseña"), h("input", { name: "clave", type: "password", required: true, minLength: 8, autocomplete: "new-password" }), h("small", "Mínimo 8 caracteres."))),
    h("label.casilla.acepto", h("input", { type: "checkbox", name: "acepto", required: true }),
      h("span", "Leí y acepto los ", h("a", { href: "terminos.html", target: "_blank", rel: "noopener" }, "términos de uso"), " y la ",
        h("a", { href: "privacidad.html", target: "_blank", rel: "noopener" }, "política de privacidad"),
        estado.modalidad === "profesor" ? "." : ", y declaro que mi institución cuenta con la autorización de las familias para registrar los datos de sus estudiantes.")),
    h("div.navegar", h("button.btn.btn-sec", { type: "button", onclick: paso2 }, "Atrás"), h("button.btn", { type: "submit" }, "Crear mi cuenta")),
  );
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); limpiar();
    const d = Object.fromEntries(new FormData(form));
    if (!d.tu_nombre?.trim() || !d.nombre?.trim()) return mostrar("Escribe tu nombre y el nombre de tu espacio.");
    if (!soloCuenta && (!d.email || (d.clave || "").length < 8)) return mostrar("Escribe un correo válido y una contraseña de al menos 8 caracteres.");
    if (!d.acepto) return mostrar("Para crear la cuenta, marca que aceptas los términos de uso y la política de privacidad.");
    const b = form.querySelector("[type=submit]"); b.disabled = true; b.textContent = "Creando…";
    const datosCuenta = { modalidad: estado.modalidad, plan: estado.plan, tu_nombre: d.tu_nombre, nombre: d.nombre, telefono: d.telefono, moneda: d.moneda, terminos: estado.terminos };
    try {
      if (!soloCuenta) {
        const { data, error } = await sb.auth.signUp({ email: d.email, password: d.clave,
          options: { emailRedirectTo: ruta("registro.html?paso=cuenta"), data: { nombre: d.tu_nombre } } });
        if (error) throw error;
        if (!data.session) {   // el proyecto pide confirmar el correo
          try { localStorage.setItem(PEND, JSON.stringify(datosCuenta)); } catch (_) {}
          cont.replaceChildren(h("h1", "Revisa tu correo"),
            h("p", `Te enviamos un enlace a ${d.email}. Ábrelo para activar tu cuenta; tu espacio se creará automáticamente.`));
          return;
        }
      }
      await crearCuenta(datosCuenta);
    } catch (err) { mostrar(mensajeError(err)); }
    finally { b.disabled = false; b.textContent = "Crear mi cuenta"; }
  });
  cont.replaceChildren(h("h1", "Tus datos"), form);
}

async function crearCuenta(d) {
  const r = await q(sb.rpc("d360_crear_cuenta", { p_modalidad: d.modalidad, p_nombre: d.nombre, p_tu_nombre: d.tu_nombre,
    p_plan: d.plan, p_telefono: d.telefono || null, p_moneda: d.moneda || "NIO", p_terminos: d.terminos || null }));
  try { localStorage.removeItem(PEND); } catch (_) {}
  elegirCuenta(r.cuenta_id);
  document.querySelector(".pasos").remove();
  document.getElementById("resumen")?.remove();
  cont.replaceChildren(
    h("h1", h("span.resaltado", r.estado === "pendiente" ? "Tu cuenta está creada" : "Tu cuenta está lista")),
    r.estado === "pendiente" ? h("div.aviso.ojo",
      h("strong", "Falta activarla. "), "Realiza el pago del primer mes por transferencia o depósito y envíanos el comprobante. La activamos el mismo día. ",
      "Mientras tanto ya puedes entrar y conocer tu panel.",
      estado.whatsapp ? [" ", h("a", { href: `https://wa.me/${estado.whatsapp}?text=${encodeURIComponent("Hola, quiero activar mi cuenta de Docencia360. Código: " + r.codigo_institucion)}`, target: "_blank", rel: "noopener" }, "Enviar comprobante por WhatsApp")] : null) : null,
    h("p", "Guarda estos dos códigos. Con ellos puedes entrar desde cualquier teléfono o computadora sin escribir tu correo."),
    h("div.hoja",
      h("p.etiqueta", "Código de tu institución"), h("p", h("span.codigo-grande", r.codigo_institucion)),
      h("p.etiqueta", "Tu código personal"), h("p", h("span.codigo-grande", r.codigo_personal)),
      h("p.tenue", "Tu código personal es secreto y no se vuelve a mostrar. Si lo pierdes, genera uno nuevo desde Mi cuenta.")),
    h("div.navegar", h("span"), h("a.btn", { href: ruta(RUTA_MODALIDAD[d.modalidad]) }, "Ir a mi panel")),
  );
}

if (soloCuenta && pendiente) {
  // Volvió del enlace de confirmación: crear la cuenta con lo que ya eligió
  cont.replaceChildren(h("p.suave", "Creando tu espacio…"));
  crearCuenta(pendiente).catch((e) => { mostrar(mensajeError(e)); estado.modalidad = pendiente.modalidad; estado.plan = pendiente.plan; paso3(); });
} else if (estado.modalidad) { estado.plan ? paso3() : paso2(); }
else paso1();
</script>
</body>
</html>
