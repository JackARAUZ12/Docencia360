<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("d360-tema")==="oscuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel maestro · Docencia360</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/d360.css">
<style>
  body { --acento: #17212B; --acento-suave: #E6E9EC; }
  :root[data-theme="dark"] body { --acento: #E8EDF1; --acento-suave: #26323D; }
    .adm-cab { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 16px; background: var(--papel); border-bottom: 2px solid var(--texto); flex-wrap: wrap; }
  .adm-cab nav { display: flex; gap: .25rem; flex-wrap: wrap; }
  .adm-cab nav a { padding: .45rem .7rem; border-radius: var(--radio-sm); text-decoration: none; color: var(--texto-2); font-weight: 700; }
  .adm-cab nav a[aria-current="page"] { color: var(--texto); background-image: linear-gradient(transparent 62%, var(--resaltador) 62%, var(--resaltador) 92%, transparent 92%); }
  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 16px 4rem; }
  .sello { font-size: .8rem; font-weight: 700; background: var(--texto); color: var(--papel); padding: .15rem .5rem; border-radius: 4px; margin-left: .5rem; }
  .filtros { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filtros > * { width: auto; }
  td input.precio { width: 7rem; text-align: right; }
  td input.lim { width: 5.5rem; text-align: right; }
  pre.det { white-space: pre-wrap; font-size: .8rem; max-height: 300px; overflow: auto; background: var(--papel-2); padding: .5rem; border-radius: 6px; }
</style>
</head>
<body>
<div id="app"><div class="vacio"><p>Verificando acceso…</p></div></div>
<script src="../assets/vendor/supabase.js"></script>
<script type="module" src="../assets/js/admin/admin.js"></script>
</body>
</html>
