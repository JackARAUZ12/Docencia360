<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4ce2">
<meta name="description" content="Docencia360 — plataforma para docentes y estudiantes.">
<title>Docencia360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./classes.js" defer></script>
<script src="./teacher-dashboard.js" defer></script>
<style>
:root{--p:#5b4ce2;--pd:#493bc8;--t:#17181c;--m:#687080;--bg:#f7f8fb;--s:#fff;--b:#e5e7eb;--d:#b42318;--ok:#087443}
*{box-sizing:border-box}html{min-width:320px;scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.page{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:var(--s);border:1px solid var(--b);border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(20,20,40,.05)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:25px}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--p);color:#fff;font-weight:900}.brandname{font-size:15px;font-weight:850;letter-spacing:.13em;color:var(--p)}h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.03em}.sub{margin:8px 0 24px;color:var(--m);font-size:14px;line-height:1.5}.form{display:grid;gap:15px}.field{display:grid;gap:7px;font-size:14px;font-weight:700}.field input,.field select{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--b);border-radius:13px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--p);box-shadow:0 0 0 3px #5b4ce21f}.primary{width:100%;min-height:48px;border:0;border-radius:13px;background:var(--p);color:#fff;font-weight:800}.primary:hover{background:var(--pd)}.primary:disabled{opacity:.55}.link{border:0;background:none;color:var(--p);font-weight:750}.switch{text-align:center;margin-top:17px;color:var(--m);font-size:14px}.msg{padding:12px 14px;border-radius:13px;background:#f4f5f8;color:var(--m);font-size:13px;line-height:1.45}.error{background:#fff0ef;color:var(--d)}.success{background:#ecfdf3;color:var(--ok)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:140px;padding:16px;border:2px solid var(--b);border-radius:17px;background:#fff;text-align:left}.choice.active{border-color:var(--p);background:#f8f7ff}.choice strong,.choice span{display:block}.choice .icon{font-size:25px}.choice strong{margin-top:8px}.choice span:last-child{margin-top:5px;color:var(--m);font-size:12px;line-height:1.4}.app{min-height:100vh}.top{min-height:68px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--b)}.top .brand{margin:0}.logout{border:1px solid var(--b);background:#fff;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:700}.content{width:min(100%,1120px);margin:auto;padding:28px 18px}.access{margin-top:18px}.code{letter-spacing:.15em;text-transform:uppercase}.help{font-size:12px;color:var(--m);line-height:1.5}.wa{display:inline-block;text-decoration:none;text-align:center;padding:12px 14px;border-radius:12px;background:#eefbf4;color:var(--ok);font-weight:800;margin-top:4px}
@media(min-width:700px){.page{padding:40px}.card{padding:32px}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){'use strict';
const app=document.getElementById('app');
const SUPABASE_URL='https://mxsfdvpxsbakvsometpk.supabase.co';
const SUPABASE_KEY='sb_publishable_NkB4WcctEUz_FlbIJCSzlg_Rnhwlj2p';
let sb=null,mode='login',teacher=true;
window.docenciaSupabase=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brand=()=>'<div class="brand"><div class="mark">D</div><div class="brandname">DOCENCIA360</div></div>';
function message(id,text,kind){const el=document.getElementById(id);if(el){el.hidden=false;el.textContent=text;el.className='msg '+(kind||'')}}
function fatal(text){app.innerHTML='<main class="page"><section class="card">'+brand()+'<h1>No pudimos iniciar</h1><p class="sub">'+esc(text)+'</p><button class="primary" onclick="location.reload()">Reintentar</button></section></main>'}
function auth(){app.innerHTML='<main class="page"><section class="card">'+brand()+'<h1>'+(mode==='login'?'Bienvenido de nuevo':'Crea tu cuenta')+'</h1><p class="sub">'+(mode==='login'?'Entra a tu espacio de Docencia360.':'Comienza tu espacio para enseñar y organizar tus clases.')+'</p><form id="f" class="form">'+(mode==='signup'?'<label class="field">Nombre completo<input id="name" required autocomplete="name"></label>':'')+'<label class="field">Correo electrónico<input id="email" type="email" required autocomplete="email"></label><label class="field">Contraseña<input id="pass" type="password" minlength="6" required autocomplete="'+(mode==='login'?'current-password':'new-password')+'"></label>'+(mode==='signup'?'<div class="choices"><button type="button" id="tc" class="choice active"><span class="icon">👨‍🏫</span><strong>Profesor</strong><span>Crearás y administrarás tus clases.</span></button><button type="button" id="sc" class="choice"><span class="icon">🎓</span><strong>Estudiante</strong><span>Te unirás a las clases de tus profesores.</span></button></div>':'')+'<div id="msg" class="msg" hidden></div><button id="go" class="primary">'+(mode==='login'?'Entrar':'Crear cuenta')+'</button></form><div class="switch">'+(mode==='login'?'¿No tienes cuenta?':'¿Ya tienes cuenta?')+' <button id="sw" class="link" type="button">'+(mode==='login'?'Crear una':'Iniciar sesión')+'</button></div></section></main>';if(mode==='signup'){const tc=document.getElementById('tc'),sc=document.getElementById('sc');tc.onclick=()=>{teacher=true;tc.classList.add('active');sc.classList.remove('active')};sc.onclick=()=>{teacher=false;sc.classList.add('active');tc.classList.remove('active')}}document.getElementById('sw').onclick=()=>{mode=mode==='login'?'signup':'login';auth()};document.getElementById('f').onsubmit=submit}
async function submit(e){e.preventDefault();const go=document.getElementById('go');go.disabled=true;try{const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(mode==='signup'){const name=document.getElementById('name').value.trim();const r=await sb.auth.signUp({email,password,options:{data:{full_name:name,is_teacher:teacher,is_student:!teacher}}});if(r.error)throw r.error;if(!r.data.session){message('msg','La cuenta fue creada. Desactiva "Confirm email" en Authentication → Providers → Email para entrar inmediatamente.','success');return}await route(r.data.user)}else{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;await route(r.data.user)}}catch(e){message('msg',e.message||'No se pudo completar la operación.','error')}finally{go.disabled=false}}
async function route(user){const r=await sb.from('profiles').select('full_name,is_teacher,is_student').eq('id',user.id).single();if(r.error){fatal('No pudimos cargar tu perfil. '+r.error.message);return}if(!r.data.full_name){onboard(r.data);return}await accessGate(user,r.data)}
function onboard(p){p=p||{};let t=!!p.is_teacher,s=!!p.is_student||(!t&&!p.is_student);app.innerHTML='<main class="page"><section class="card">'+brand()+'<h1>Configuremos tu espacio</h1><p class="sub">Puedes usar Docencia360 como profesor, estudiante o ambos.</p><form id="o" class="form"><label class="field">Nombre completo<input id="fn" value="'+esc(p.full_name||'')+'" required></label><div class="choices"><button type="button" id="t" class="choice '+(t?'active':'')+'"><span class="icon">👨‍🏫</span><strong>Profesor</strong><span>Crea clases, actividades y evalúa.</span></button><button type="button" id="s" class="choice '+(s?'active':'')+'"><span class="icon">🎓</span><strong>Estudiante</strong><span>Únete a clases y completa actividades.</span></button></div><div id="om" class="msg" hidden></div><button class="primary">Continuar</button></form></section></main>';document.getElementById('t').onclick=()=>{t=!t;document.getElementById('t').classList.toggle('active',t)};document.getElementById('s').onclick=()=>{s=!s;document.getElementById('s').classList.toggle('active',s)};document.getElementById('o').onsubmit=async e=>{e.preventDefault();if(!t&&!s){message('om','Selecciona al menos una modalidad.','error');return}const{data:{user}}=await sb.auth.getUser();const r=await sb.from('profiles').update({full_name:document.getElementById('fn').value.trim(),is_teacher:t,is_student:s}).eq('id',user.id).select('full_name,is_teacher,is_student').single();if(r.error){message('om',r.error.message,'error');return}await accessGate(user,r.data)}}
async function accessGate(user,p){const r=await sb.from('account_access').select('status,expires_at').eq('user_id',user.id).maybeSingle();if(r.error){fatal('No pudimos comprobar el acceso de tu cuenta. '+r.error.message);return}if(r.data&&r.data.status==='active'&&(!r.data.expires_at||new Date(r.data.expires_at)>new Date())){home(user,p);return}showAccess()}
function showAccess(msg='',cls=''){app.innerHTML='<main class="page"><section class="card access">'+brand()+'<h1>Activa tu cuenta</h1><p class="sub">Tu cuenta está creada. Introduce el código de acceso que recibes después de realizar tu pago.</p><form id="af" class="form"><label class="field">Código de acceso<input id="ac" class="code" maxlength="32" autocomplete="one-time-code" placeholder="D360-X7K9-PQ4M" required></label><div id="am" class="msg '+cls+'" '+(msg?'':'hidden')+'>'+esc(msg)+'</div><button id="ab" class="primary">Activar cuenta</button></form><p class="help">¿Ya realizaste tu pago y no tienes el código?</p><a class="wa" href="https://wa.me/?text=Hola%2C%20necesito%20mi%20c%C3%B3digo%20de%20acceso%20a%20Docencia360" target="_blank" rel="noopener">Solicitar código por WhatsApp</a><div class="switch"><button id="lo" class="link" type="button">Cerrar sesión</button></div></section></main>';document.getElementById('af').onsubmit=redeem;document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();auth()}}
async function redeem(e){e.preventDefault();const b=document.getElementById('ab'),m=document.getElementById('am');b.disabled=true;m.hidden=true;try{const code=document.getElementById('ac').value.trim().toUpperCase();const r=await sb.rpc('redeem_access_code',{p_code:code});if(r.error)throw r.error;m.hidden=false;m.className='msg success';m.textContent='Cuenta activada correctamente.';const{data:{user}}=await sb.auth.getUser();const p=await sb.from('profiles').select('full_name,is_teacher,is_student').eq('id',user.id).single();if(p.error)throw p.error;setTimeout(()=>home(user,p.data),450)}catch(e){m.hidden=false;m.className='msg error';m.textContent=e.message==='invalid_or_used_access_code'?'El código no es válido, ya fue utilizado o está vencido.':'No se pudo activar la cuenta. Intenta nuevamente.'}finally{b.disabled=false}}
function home(user,p){p=p||{};app.innerHTML='<div class="app"><header class="top"><div>'+brand()+'</div><button class="logout" id="lo">Cerrar sesión</button></header><main class="content"></main></div>';document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();auth()};const mount=()=>{if(p.is_teacher===true&&typeof window.mountTeacherDashboard==='function'){window.mountTeacherDashboard(user,p);return}if(p.is_student===true&&typeof window.mountStudentClasses==='function'){window.mountStudentClasses(user);return}setTimeout(mount,80)};mount()}
async function start(){try{if(!window.supabase||!window.supabase.createClient)throw new Error('No se pudo cargar el cliente de Supabase.');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);window.docenciaSupabase=sb;const{data:{session}}=await sb.auth.getSession();if(session)await route(session.user);else auth()}catch(e){fatal(e.message||'No se pudo iniciar Docencia360.')}}
window.addEventListener('unhandledrejection',e=>console.error(e.reason));start();
})();
</script>
</body>
</html>
