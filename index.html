<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b4ce2"><title>Docencia360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#5b4ce2;--pd:#493bc8;--t:#17181c;--m:#687080;--bg:#f7f8fb;--s:#fff;--b:#e5e7eb;--d:#b42318;--ok:#087443}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.page{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:var(--s);border:1px solid var(--b);border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(20,20,40,.05)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:25px}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--p);color:#fff;font-weight:900}.brandname{font-size:15px;font-weight:850;letter-spacing:.13em;color:var(--p)}h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.03em}.sub{margin:8px 0 24px;color:var(--m);font-size:14px;line-height:1.5}.form{display:grid;gap:15px}.field{display:grid;gap:7px;font-size:14px;font-weight:700}.field input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--b);border-radius:13px;outline:none}.field input:focus{border-color:var(--p);box-shadow:0 0 0 3px #5b4ce21f}.primary{width:100%;min-height:48px;border:0;border-radius:13px;background:var(--p);color:#fff;font-weight:800}.primary:hover{background:var(--pd)}.primary:disabled{opacity:.55}.link{border:0;background:none;color:var(--p);font-weight:750}.switch{text-align:center;margin-top:17px;color:var(--m);font-size:14px}.msg{padding:12px 14px;border-radius:13px;background:#f4f5f8;color:var(--m);font-size:13px}.error{background:#fff0ef;color:var(--d)}.success{background:#ecfdf3;color:var(--ok)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:140px;padding:16px;border:2px solid var(--b);border-radius:17px;background:#fff;text-align:left}.choice.active{border-color:var(--p);background:#f8f7ff}.choice strong,.choice span{display:block}.choice .icon{font-size:25px}.choice strong{margin-top:8px}.choice span:last-child{margin-top:5px;color:var(--m);font-size:12px;line-height:1.4}.app{min-height:100vh}.top{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--b)}.top .brand{margin:0}.logout{border:1px solid var(--b);background:#fff;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:700}.content{width:min(100%,960px);margin:auto;padding:28px 18px}.notice{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--b)}@media(min-width:700px){.page{padding:40px}.card{padding:32px}}
</style></head><body><div id="app"></div>
<script>
const sb=supabase.createClient('https://mxsfdvpxsbakvsometpk.supabase.co','sb_publishable_NkB4WcctEUz_FlbIJCSzlg_Rnhwlj2p');const app=document.getElementById('app');let mode='login',teacher=true;
const brand=()=>'<div class="brand"><div class="mark">D</div><div class="brandname">DOCENCIA360</div></div>';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function auth(){app.innerHTML='<main class="page"><section class="card">'+brand()+'<h1>'+(mode==='login'?'Bienvenido de nuevo':'Crea tu cuenta')+'</h1><p class="sub">'+(mode==='login'?'Entra a tu espacio de Docencia360.':'Comienza tu espacio para enseñar y organizar tus clases.')+'</p><form id="f" class="form">'+(mode==='signup'?'<label class="field">Nombre completo<input id="name" required autocomplete="name"></label>':'')+'<label class="field">Correo electrónico<input id="email" type="email" required autocomplete="email"></label><label class="field">Contraseña<input id="pass" type="password" minlength="6" required></label>'+(mode==='signup'?'<button id="tc" type="button" class="choice active"><span class="icon">👨‍🏫</span><strong>Registrarme como profesor</strong><span>También podrás usar el modo estudiante.</span></button>':'')+'<div id="msg" class="msg" hidden></div><button id="go" class="primary">'+(mode==='login'?'Entrar':'Crear cuenta')+'</button></form><div class="switch">'+(mode==='login'?'¿No tienes cuenta?':'¿Ya tienes cuenta?')+' <button id="sw" class="link" type="button">'+(mode==='login'?'Crear una':'Iniciar sesión')+'</button></div></section></main>';
if(mode==='signup')document.getElementById('tc').onclick=()=>{teacher=!teacher;document.getElementById('tc').classList.toggle('active',teacher);document.getElementById('tc').querySelector('strong').textContent=teacher?'Registrarme como profesor':'Registrarme como estudiante'};document.getElementById('sw').onclick=()=>{mode=mode==='login'?'signup':'login';auth()};document.getElementById('f').onsubmit=submit}
function message(t,c){const m=document.getElementById('msg');if(m){m.hidden=false;m.textContent=t;m.className='msg '+(c||'')}}
async function submit(e){e.preventDefault();const go=document.getElementById('go');go.disabled=true;try{const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(mode==='signup'){const name=document.getElementById('name').value.trim();const r=await sb.auth.signUp({email,password,options:{data:{full_name:name,is_teacher:teacher}}});if(r.error)throw r.error;if(!r.data.session){message('Cuenta creada. Revisa tu correo para confirmar la cuenta.','success');return}await route(r.data.user)}else{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;await route(r.data.user)}}catch(e){message(e.message||'No se pudo completar la operación.','error')}finally{go.disabled=false}}
async function route(user){const r=await sb.from('profiles').select('full_name,is_teacher,is_student').eq('id',user.id).single();if(r.error){message(r.error.message,'error');return}if(!r.data.full_name){onboard(r.data);return}home(r.data)}
function onboard(p){let t=!!p.is_teacher,s=!!p.is_student||(!t&&!p.is_student);app.innerHTML='<main class="page"><section class="card">'+brand()+'<h1>Configuremos tu espacio</h1><p class="sub">Puedes usar Docencia360 como profesor, estudiante o ambos.</p><form id="o" class="form"><label class="field">Nombre completo<input id="fn" value="'+esc(p.full_name)+'" required></label><div class="choices"><button type="button" id="t" class="choice '+(t?'active':'')+'"><span class="icon">👨‍🏫</span><strong>Profesor</strong><span>Crea clases, actividades y evalúa.</span></button><button type="button" id="s" class="choice '+(s?'active':'')+'"><span class="icon">🎓</span><strong>Estudiante</strong><span>Únete a clases y completa actividades.</span></button></div><div id="om" class="msg" hidden></div><button class="primary">Continuar</button></form></section></main>';document.getElementById('t').onclick=()=>{t=!t;document.getElementById('t').classList.toggle('active',t)};document.getElementById('s').onclick=()=>{s=!s;document.getElementById('s').classList.toggle('active',s)};document.getElementById('o').onsubmit=async e=>{e.preventDefault();if(!t&&!s){const m=document.getElementById('om');m.hidden=false;m.textContent='Selecciona al menos una modalidad.';m.className='msg error';return}const{data:{user}}=await sb.auth.getUser();const r=await sb.from('profiles').update({full_name:document.getElementById('fn').value.trim(),is_teacher:t,is_student:s}).eq('id',user.id).select().single();if(r.error){const m=document.getElementById('om');m.hidden=false;m.textContent=r.error.message;m.className='msg error';return}home(r.data)}}
function home(p){app.innerHTML='<div class="app"><header class="top"><div class="brand">'+brand()+'</div><button class="logout" id="lo">Cerrar sesión</button></header><main class="content"><h1>Hola, '+esc((p.full_name||'').split(' ')[0])+' 👋</h1><p class="sub">Tu espacio de Docencia360 está preparado.</p><section class="notice"><strong>Base central lista</strong><p class="sub" style="margin-bottom:0">El próximo módulo será Clases: crear una clase, generar su código y permitir que los estudiantes se unan.</p></section></main></div>';document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();auth()}}
async function start(){const{data:{session}}=await sb.auth.getSession();if(session)await route(session.user);else auth()}start();
</script></body></html>
