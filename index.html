<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b4ce2">
  <meta name="description" content="Docencia360 — plataforma para docentes y estudiantes.">
  <title>Docencia360</title>
  <style>
    :root { --primary:#5b4ce2; --text:#17181c; --muted:#687080; --bg:#f7f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,420px); text-align:center; }
    .mark { width:56px; height:56px; margin:0 auto; display:grid; place-items:center; border-radius:17px; background:var(--primary); color:#fff; font-size:22px; font-weight:800; }
    .brand { margin:16px 0 0; font-size:13px; font-weight:800; letter-spacing:.18em; color:var(--primary); }
    .status { margin:8px 0 0; color:var(--muted); font-size:14px; }
    .error { margin-top:18px; padding:12px 14px; border-radius:12px; background:#fff; border:1px solid #e5e7eb; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">D</div>
    <p class="brand">DOCENCIA360</p>
    <p class="status" id="status">Preparando tu espacio…</p>
    <p class="error" id="error" hidden></p>
  </main>
  <script type="module">
    const SUPABASE_URL = window.DOCENCIA360_SUPABASE_URL;
    const SUPABASE_KEY = window.DOCENCIA360_SUPABASE_KEY;
    const status = document.getElementById('status');
    const error = document.getElementById('error');

    // Static GitHub Pages entry point. Supabase credentials can be injected
    // by the hosting page without putting a service-role secret in source.
    if (!SUPABASE_URL || !SUPABASE_KEY) {
      status.textContent = 'Configuración pendiente';
      error.hidden = false;
      error.textContent = 'Conecta las variables públicas de Supabase para iniciar Docencia360.';
    } else {
      status.textContent = 'Base preparada';
    }
  </script>
</body>
</html>
