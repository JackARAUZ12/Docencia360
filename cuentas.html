<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tus cuentas · Docencia360</title>
<link rel="icon" href="assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/d360.css">
</head>
<body>
<main style="max-width:560px;margin:0 auto;padding:2rem 16px">
  <div id="marca" style="margin-bottom:2rem"></div>
  <h1>¿A qué cuenta quieres entrar?</h1>
  <ul class="lista" id="lista"></ul>
  <p style="margin-top:1.5rem;display:flex;gap:1rem;flex-wrap:wrap"><a href="registro.html?paso=cuenta&nueva=1">Crear otra cuenta</a><a href="#" id="salir">Cerrar sesión</a></p>
</main>
<script src="assets/vendor/supabase.js"></script>
<script type="module">
import { h, marca } from "./assets/js/core/ui.js";
import { sesionActual, misCuentas, elegirCuenta, ruta, RUTA_MODALIDAD, salir } from "./assets/js/core/sesion.js";
document.getElementById("marca").append(marca("index.html"));
document.getElementById("salir").addEventListener("click", (e) => { e.preventDefault(); salir(); });
if (!(await sesionActual())) location.replace(ruta("entrar.html"));
const nombres = { profesor: "Profesor independiente", academia: "Academia", colegio: "Colegio" };
const cuentas = await misCuentas();
document.getElementById("lista").replaceChildren(...cuentas.map((c) => h("li",
  h("div.crece", h("div.titulo", c.nombre), h("div.tenue", `${nombres[c.modalidad]} · ${c.rol} · Plan ${c.plan_nombre}`)),
  h("button.btn.btn-sm", { onclick: () => { elegirCuenta(c.cuenta_id); location.href = ruta(RUTA_MODALIDAD[c.modalidad]); } }, "Entrar"))));
</script>
</body>
</html>
